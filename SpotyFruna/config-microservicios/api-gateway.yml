  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Usuarios
        url: /v3/api-docs/usuarios

      - name: Tipos Usuarios
        url: /v3/api-docs/tipos_usuarios

      - name: Registros
        url: /v3/api-docs/registros

      - name: Estados Registros
        url: /v3/api-docs/estados_registros

      - name: Albumes
        url: /v3/api-docs/albumes

      - name: Tipos Albumes
        url: /v3/api-docs/tipos_albumes

      - name: Canciones
        url: /v3/api-docs/canciones

      - name: Generos Canciones
        url: /v3/api-docs/generos_canciones

      - name: Reportes
        url: /v3/api-docs/reportes

      - name: Estados Reportes
        url: /v3/api-docs/estados_reportes

      - name: Tipos Reportes
        url: /v3/api-docs/tipos_reportes

      - name: Suscripciones
        url: /v3/api-docs/suscripciones

      - name: Planes
        url: /v3/api-docs/planes

      - name: Reproducciones
        url: /v3/api-docs/reproducciones

      - name: Dispositivos Reproducciones
        url: /v3/api-docs/dispositivos_reproducciones

      - name: Playlists
        url: /v3/api-docs/playlists

